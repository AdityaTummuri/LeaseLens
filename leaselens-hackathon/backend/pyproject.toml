[project]
name = "leaselens-backend"
version = "1.1.0"
description = "Multi-agent residential lease risk analyzer backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function call in argument defaults (FastAPI uses this)
    "SIM108", # ternary operator suggestion
    "UP042",  # str, Enum inheritance preserved for Pydantic v2 cross-version compatibility
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "schemas"]

[tool.coverage.run]
source = ["."]
omit = ["test_*", "conftest.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 60
